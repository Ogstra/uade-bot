services:
  uade-go:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["uade-data:/app/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  uade-data:
